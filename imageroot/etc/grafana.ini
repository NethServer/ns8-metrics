[auth.proxy]
# Trusting a header from any local process is unsafe: use auth.jwt
enabled = false

[auth.jwt]
# Traefik forward auth asks api-server on every request, which answers with
# a short-lived signed token. Grafana sets no session cookie with auth.jwt.
enabled = true
header_name = X-Auth-Token
username_claim = sub
key_file = /etc/grafana/ns8-jwt.pub
auto_sign_up = true
# Without this, admin login fails with "cannot remove last organization admin"
skip_org_role_sync = true

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[log]
level = warn
